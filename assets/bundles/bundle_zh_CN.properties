# 进度脚本编辑器
patch-editor.editProgress = 进度脚本
patch-editor.editProgress.script = 脚本
patch-editor.editProgress.defaultHint = 提示：当前为内置的默认脚本，并非当前字段的进度脚本。点击 [accent]教程[] 按钮学习脚本语法。
patch-editor.editProgress.tutorial = 教程

patch-editor.editProgress.tutorial.title = 进度脚本教程

patch-editor.editProgress.tutorial.section.1.title = 1. 什么是进度脚本？
patch-editor.editProgress.tutorial.section.1.text.1 = 进度脚本是一个表达式：以 [accent]build(...)[] 为起点，链式调用变换函数，最终得到一个[accent]进度[]。进度根据部件的参数（PartParams）实时计算，通常为 0~1 的数值，用于控制部件的动画、位移、透明度等。
patch-editor.editProgress.tutorial.section.1.text.2 = 脚本会实时求值：上方的预览区会播放结果曲线。如果脚本出错，错误信息会显示在红色错误栏中，此时无法点击[accent]确定[]。

patch-editor.editProgress.tutorial.section.2.title = 2. build 函数
patch-editor.editProgress.tutorial.section.2.text.1 = build 是每个脚本的起点，它会创建一个进度，共有三种调用方式：
patch-editor.editProgress.tutorial.build.1.params = progress：内置的 PartProgress 变量（如 warmup、heat、reload…）
patch-editor.editProgress.tutorial.build.1.desc = 以某个内置进度作为基底。
patch-editor.editProgress.tutorial.build.2.params = number：数字（如 0.5）
patch-editor.editProgress.tutorial.build.2.desc = 创建一个恒定值的进度。
patch-editor.editProgress.tutorial.build.3.params = progress：PartProgress 变量；interp：Interp 变量
patch-editor.editProgress.tutorial.build.3.desc = 等价于 build(progress).curve(interp)。

patch-editor.editProgress.tutorial.section.3.title = 3. 可链式调用的函数
patch-editor.editProgress.tutorial.section.3.text.1 = build(...) 返回的进度可以继续链式调用下面的函数——每个函数都会返回一个新的进度，因此可以任意组合。

patch-editor.editProgress.tutorial.op.group.basic = 无参数
patch-editor.editProgress.tutorial.op.group.number = 数值参数（float）
patch-editor.editProgress.tutorial.op.group.progress = 进度参数（PartProgress）
patch-editor.editProgress.tutorial.op.group.interp = 插值参数（Interp）


patch-editor.editProgress.tutorial.section.4.title = 4. 内置变量
patch-editor.editProgress.tutorial.section.4.text.1 = 以下变量已内置到脚本作用域中，可直接在 build(...) 与上述函数中使用。

patch-editor.editProgress.tutorial.var.group.progress = PartProgress 变量
patch-editor.editProgress.tutorial.var.group.interp = Interp 变量
patch-editor.editProgress.tutorial.var.copy = 点击复制

patch-editor.editProgress.tutorial.var.progress.warmup = 预热进度（0~1），随方块启动而上升
patch-editor.editProgress.tutorial.var.progress.reload = 装填进度（0~1）
patch-editor.editProgress.tutorial.var.progress.smoothReload = 平滑后的装填进度
patch-editor.editProgress.tutorial.var.progress.charge = 充能进度（0~1），如蓄力攻击
patch-editor.editProgress.tutorial.var.progress.recoil = 后座进度（发射时瞬间为 1，随后回落）
patch-editor.editProgress.tutorial.var.progress.heat = 过热程度（0~1），开火时上升
patch-editor.editProgress.tutorial.var.progress.life = 生命周期进度（如弹体的剩余寿命，从 1 衰减到 0）
patch-editor.editProgress.tutorial.var.progress.time = 部件已运行的时间（帧），持续增长

